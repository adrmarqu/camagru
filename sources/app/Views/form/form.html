<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        /* 1. Iconos dentro de los inputs (Username, Email, Passwords) */
        .input-icon
        {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .input-wrapper
        {
            position: relative;     /* Necesario para que .input-icon se posicione bien */
            display: flex;
            align-items: center;
        }

        /* Espacio interno a la izquierda para que el texto del input no pise al icono */
        .input-wrapper input
        {
            padding-left: 42px;     
        }
    </style>
</head>
<body>
    <form action="">
        <h2>Iniciar sessión</h2>
        <!-- Usermail -->
        <div>
            <label for="usermail">Usuario o Correo</label>
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 21a8 8 0 0 0-12 0"></path>
                    <circle cx="12" cy="10" r="4"></circle>
                    <circle cx="12" cy="12" r="10"></circle>
                </svg>
                <input name="usermail" type="text" placeholder="Usuario o Correo">
            </div>
            <span>Este campo es obligatorio</span>
        </div>

        <!-- User -->
        <div>
            <label for="user">Usuario</label>
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input name="user" type="text" placeholder="Usuario">
            </div>
            <span>Este campo es obligatorio</span>
        </div>

        <!-- Email -->
        <div>
            <label for="email">Correo</label>
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <input name="email" type="email" placeholder="Correo">
            </div>
            <span>Este campo es obligatorio</span>
        </div>

        <!-- Password -->
        <div>
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input name="password" type="password" placeholder="Contraseña">
            </div>
            <span>Este campo es obligatorio</span>
        </div>

        <!-- Confirm password -->
        <div>
            <label for="confirm">Repetir contraseña</label>
            <div class="input-wrapper">
                <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    <path d="m9 16 2 2 4-4"></path>
                </svg>
                <input name="confirm" type="password" placeholder="Repetir contraseña">
            </div>
            <span>Este campo es obligatorio</span>
        </div>
    </form>
</body>
</html>
