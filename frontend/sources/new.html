<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <main class="flex flex-column flex-center">

        <h1 class="h text-white">Actualizar contraseña del usuario</h1>

        <p class="p text-white">
            Introduce la nueva contraseña más el seguro para actualizar la contraseña.
        </p>

        <form class="form flex flex-column">
            <div class="flex flex-column">
                <label class="form-label" for="pass">Nueva contraseña</label>
                <input class="form-input" type="password" name="pass">
            </div>

            <div class="flex flex-column">
                <label class="form-label" for="pass_rep">
                    Repetir nueva contraseña</label>
                <input class="form-input" type="password" name="pass_rep">
            </div>

            <div class="form-btn-container">
                <button class="btn btn-secondary" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
        </form>
    </main>
</body>
</html>
