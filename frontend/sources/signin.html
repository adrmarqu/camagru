<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <main class="flex flex-column flex-center">

        <h1 class="h text-white">Bienvenido a Camagru</h1>

        <p class="p text-white">
            Rellena el formulario para entrar una nueva cuenta
        </p>

        <form class="form flex flex-column">
            <div class="flex flex-column">
                <label class="form-label" for="user">Usuario</label>
                <input class="form-input" type="text" name="user">
            </div>

            <div class="flex flex-column">
                <label class="form-label" for="email">Correo</label>
                <input class="form-input" type="email" name="email">
            </div>

            <div class="flex flex-column">
                <label class="form-label" for="pass">Contraseña</label>
                <input class="form-input" type="password" name="pass">
            </div>

            <div class="flex flex-column">
                <label class="form-label" for="pass_rep">Repetir contraseña</label>
                <input class="form-input" type="password" name="pass_rep">
            </div>

            <div class="flex flex-end flex-row-reverse">
                <label class="form-label" for="terms">
                    Aceptar Terminos y servicios
                </label>
                <input class="form-checkbox" type="checkbox" name="terms">
            </div>

            <div class="form-btn-container">
                <button class="btn btn-secondary" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
        </form>
    </main>
</body>
</html>
