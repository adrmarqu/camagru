<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <main class="flex flex-column flex-center">

        <h1 class="h text-white">Bienvenido de nuevo a Camagru</h1>

        <p class="p text-white">Inicia session para entrar</p>

        <form class="form flex flex-column">
            <div class="flex flex-column">
                <label class="form-label" for="usermail">Usuario</label>
                <input class="form-input" type="text" name="usermail">
            </div>

            <div class="flex flex-column">
                <label class="form-label" for="pass">Contraseña</label>
                <input class="form-input" type="password" name="pass">
            </div>

            <div class="flex flex-between">
                <div class="flex flex-end flex-row-reverse">
                    <label class="form-label" for="remember">Recordar contraseña</label>
                    <input class="form-checkbox" type="checkbox" name="remember">
                </div>
                <a class="link" href="">Recupera la contraseña</a>
            </div>

            <div class="form-btn-container">
                <button class="btn btn-secondary" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
        </form>
    </main>
</body>
</html>
