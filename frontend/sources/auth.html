<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link rel="icon" href="../assets/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/components.css">
    <script src="../scripts/header.js" defer></script>
</head>
<body>
    <header class="flex-between">
        <a id="home" class="link" href="./gallery.html">Camagru</a>

        <nav>
                <div class="flex-between">
                    <a class="link header nav-pc" href="./gallery.html">Gallery</a>
                    <a class="link header nav-pc" href="./editor.html">Editor</a>

                    <div class="nav-auth-pc dropdown">
                        <button id="btn-drop" class="btn btn-drop">Invitado</button>

                        <div id="drop" class="hidden">
                            <div class="dropdown-list">
                                <a class="link header drop nav-mobile" href="./gallery.html">Gallery</a>
                                <a class="link header drop nav-mobile" href="./editor.html">Editor</a>
                                <a class="link header drop" href="./editor.html">Mis fotos</a>
                                <a class="link header drop" href="./editor.html">Mis favoritos</a>
                                <a class="link header drop" href="./editor.html">Settings</a>

                                <button id="btn-lang" class="btn btn-lang">Español</button>
                        
                                <div id="drop-lang" class="hidden">
                                    <div class="dropdown-list lang-pos">
                                        <a class="link header drop" href="./auth.html?lang=es">Español</a>
                                        <a class="link header drop" href="./auth.html?lang=ca">Catalan</a>
                                        <a class="link header drop" href="./auth.html?lang=en">Ingles</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <img id="logout" class="icon" src="../assets/logout.png" alt="logout" title="logout">
                </div>
        </nav>
    </header>
</body>
</html>
