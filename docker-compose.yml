services:
  # Servidor Web / Reverse Proxy (Nginx)
  webserver:
    image: nginx:alpine
    container_name: camagru_webserver
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./sources:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - camagru-network

  # Procesador PHP (PHP-FPM) con librerías nativas para imágenes (GD)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camagru_app
    restart: always
    volumes:
      - ./sources:/var/www/html
    env_file:
      - .env
    networks:
      - camagru-network
    depends_on:
      - db

  # Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: camagru_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sources/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - camagru-network

  # Interfaz Web para BBDD (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: camagru_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - camagru-network

volumes:
  db_data:

networks:
  camagru-network:
    driver: bridge